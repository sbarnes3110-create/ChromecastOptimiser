name: Build Android TV APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TV-Optimiser-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct-download APK in repository
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TV-Optimiser.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TV-Optimiser.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish TV Optimiser installable APK"
            git push origin HEAD:main
          fi
