name: FitClear HM08 APK
on:
  push:
    branches: [fitclear-hm08]
    paths:
      - 'fitclear/**'
      - '.github/workflows/fitclear-hm08.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: fitclear
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FitClear-HM08-Diagnostic-v2
          path: fitclear/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK on test branch
        run: |
          cp fitclear/app/build/outputs/apk/debug/app-debug.apk FitClear-HM08-Diagnostic-v2.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FitClear-HM08-Diagnostic-v2.apk
          if ! git diff --cached --quiet; then
            git commit -m "Add FitClear diagnostic APK [skip ci]"
            git push origin HEAD:fitclear-hm08
          fi
